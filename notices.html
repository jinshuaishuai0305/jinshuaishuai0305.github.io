<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="自动汇集山西省科学技术厅科技计划项目申报通知与公示公告，附原文链接。">
  <meta name="theme-color" content="#070b14">
  <title>申报通知 · 游志勇课题组</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="notices">
  <div class="scroll-progress" aria-hidden="true"></div>
  <header class="site-header" id="site-header"></header>

  <main>

    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">首页</a><span>/</span><span>申报通知</span></div>
        <p class="eyebrow">Funding Calls</p>
        <h1 class="page-title">申报通知<br><span class="gradient-text">自动汇集</span></h1>
        <p class="lead">每日自动抓取山西省科学技术厅发布的科技计划申报通知、征集指南与公示公告，原文链接直达，便于课题组与合作伙伴及时跟进。</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar reveal">
          <div class="filter-group" id="noticeFilters">
            <button class="filter-btn is-active" type="button" data-filter="all">全部</button>
          </div>
          <label class="search-box" aria-label="搜索申报通知">
            <input id="noticeSearch" type="search" placeholder="搜索标题，如 重点研发计划 / 基础研究">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </label>
        </div>

        <div class="notice-list" id="notice-list"></div>

        <p class="notice-foot">
          数据由 <code>tools/sx-sci-watch</code> 脚本自动抓取自山西省科学技术厅（kjt.shanxi.gov.cn），
          最近更新 <span id="noticeUpdated">—</span>；条目以官网原文为准，如发现遗漏请以官网检索结果为准。
        </p>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <button class="back-to-top" id="backToTop" type="button" aria-label="回到顶部"></button>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/notices.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
