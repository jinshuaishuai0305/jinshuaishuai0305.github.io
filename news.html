<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="游志勇课题组论文发表、项目进展与学术交流动态。">
  <meta name="theme-color" content="#070b14">
  <title>新闻动态 · 游志勇课题组</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="news">
  <div class="scroll-progress" aria-hidden="true"></div>
  <header class="site-header" id="site-header"></header>

  <main>

    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">首页</a><span>/</span><span>新闻动态</span></div>
        <p class="eyebrow">News & Events</p>
        <h1 class="page-title">新闻中心<br><span class="gradient-text">工作动态 · 通知公告</span></h1>
        <p class="lead">聚焦科研进展、工作动态、通知公告与学术活动，记录课题组与团队不断向前的每一步。</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar reveal">
          <div class="filter-group" id="newsFilters">
            <button class="filter-btn is-active" type="button" data-filter="all">全部</button>
            <button class="filter-btn" type="button" data-filter="科研进展">科研进展</button>
            <button class="filter-btn" type="button" data-filter="工作动态">工作动态</button>
            <button class="filter-btn" type="button" data-filter="学术活动">学术活动</button>
            <button class="filter-btn" type="button" data-filter="通知公告">通知公告</button>
          </div>
          <label class="search-box" aria-label="搜索新闻动态">
            <input id="newsSearch" type="search" placeholder="搜索新闻、活动或关键词">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </label>
        </div>
        <div class="timeline" id="news-list"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <button class="back-to-top" id="backToTop" type="button" aria-label="回到顶部"></button>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
